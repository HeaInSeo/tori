name: core-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: v1.7.7

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Validate GitHub Actions workflows
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

  proto-lint:
    name: Proto Lint (Buf)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"
          # Authenticate the tool-download GitHub API call to avoid anonymous
          # rate limiting (429 on the Buf release lookup).
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: buf lint protos

      # format/breaking are Observe-only for now: AGENTS.md ("14. 현재 세션에서
      # 가장 중요한 해석") explicitly defers service/gRPC/protobuf contract
      # failures during Phase 0/Track A, and Proto Lint (Buf) is a required
      # status check - so these steps must not fail the job.
      - name: Buf format check (Observe)
        continue-on-error: true
        run: buf format --exit-code -d protos

      - name: Fetch base branch ref
        run: git fetch origin master:refs/heads/master

      - name: Buf breaking change check (Observe)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            buf breaking protos --against '.git#branch=master,subdir=protos'
          else
            buf breaking protos --against '.git#ref=HEAD~1,subdir=protos'
          fi

  core-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Run core tests
        run: make test-core

      - name: Run core lint gate
        run: make lint

      - name: Run security lint guardrail
        run: make lint-security-check

      - name: Run vulnerability guardrail
        run: make vuln-check

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tori-coverage
          path: reports/
