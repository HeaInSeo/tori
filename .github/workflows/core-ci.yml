name: core-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  proto-lint:
    name: Proto Lint (Buf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Buf lint
        uses: bufbuild/buf-action@v1
        with:
          input: protos
          lint: true

  core-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run core tests
        run: make test-core

      - name: Run core lint gate
        run: make lint
